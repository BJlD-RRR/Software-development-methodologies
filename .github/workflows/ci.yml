name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CI: збірка рішення та модульні тести
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WarehouseManagement.sln

      - name: Build
        run: dotnet build WarehouseManagement.sln -c Release --no-restore

      - name: Test
        run: dotnet test WarehouseManagement.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  # CI: збірка Docker-образу та smoke-тест усього стеку docker compose
  docker-smoke:
    name: Docker Compose smoke test
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build --wait db

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/products > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Smoke test API
        run: |
          curl -sf -X POST http://localhost:8080/api/products \
            -H 'Content-Type: application/json' \
            -d '{"sku":"CI-001","name":"CI product","category":"CI","unitOfMeasure":"pcs","minStockLevel":1}'
          curl -sf http://localhost:8080/api/products | grep -q CI-001
          curl -sf -o /dev/null http://localhost:8080/swagger/index.html

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # CD: публікація образу Web API в GitHub Container Registry (лише для main)
  publish:
    name: Publish image to GHCR
    needs: docker-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/warehouse-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./src/WarehouseApi
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
